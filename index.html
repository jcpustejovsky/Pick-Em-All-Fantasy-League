<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pick 'Em All — Fantasy Football</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      turf: '#1E3D2F', turfdeep: '#152D22', chalk: '#FAF9F4',
      paper: '#F0EEE5', gold: '#D9A62E', brick: '#9B4038', line: '#D8D4C6',
    } } }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .ff-num { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -0.02em; }
  .ff-row:nth-child(even) { background: #F0EEE5; }
</style>
</head>
<body class="bg-paper text-turfdeep min-h-screen">
<div id="app" class="min-h-screen">
  <div class="p-8 text-center text-turfdeep">Loading…</div>
</div>

<script>
// ====================================================================
// CONFIG — from Supabase: Project Settings > API
// ====================================================================
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Roster: 8 players, all of them score. No bench.
const SLOTS = [
  { key: "QB",   label: "QB",    cap: 2, positions: ["QB"] },
  { key: "RB",   label: "RB",    cap: 3, positions: ["RB"] },
  { key: "WRTE", label: "WR/TE", cap: 3, positions: ["WR", "TE"] },
];
const ROSTER_SIZE = SLOTS.reduce((s, g) => s + g.cap, 0); // 8

function groupOf(pos) {
  const g = SLOTS.find((s) => s.positions.includes(pos));
  return g ? g.key : null;
}

// ====================================================================
// STATE
// ====================================================================
let state = {
  loading: true,
  session: null,
  profile: null,
  players: [],
  profiles: [],
  teamCount: 0,
  meta: { current_week: 1, max_teams: 10, scoring_mode: "standard" },
  weekInfo: [],
  weeklyPlayers: [],
  picksRows: [],
  pointsRows: [],
  tab: "picks",
  viewWeek: 0,
  rosterManagerId: null,
  search: "",
  groupFilter: "ALL",
  authMode: "signin",
  authError: "",
  notice: "",
  busy: false,
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

// ====================================================================
// PURE HELPERS
// ====================================================================
function picksFor(week, userId) {
  return state.picksRows
    .filter((r) => r.week === week && r.user_id === userId)
    .map((r) => r.player_id);
}

function pointsMapFor(week) {
  const map = {};
  state.pointsRows.filter((r) => r.week === week)
    .forEach((r) => (map[r.player_id] = Number(r.points)));
  return map;
}

function countByGroup(pickIds) {
  const byId = Object.fromEntries(state.players.map((p) => [p.id, p]));
  const counts = { QB: 0, RB: 0, WRTE: 0 };
  (pickIds || []).forEach((id) => {
    const p = byId[id];
    if (!p) return;
    const g = groupOf(p.pos);
    if (g) counts[g]++;
  });
  return counts;
}

// Every pick scores. Total is just the sum.
function computeRoster(pickIds, pointsMap) {
  const byId = Object.fromEntries(state.players.map((p) => [p.id, p]));
  const roster = (pickIds || [])
    .map((id) => byId[id] && { ...byId[id], pts: pointsMap[id] ?? 0 })
    .filter(Boolean);
  const groups = {};
  SLOTS.forEach((s) => {
    groups[s.key] = roster
      .filter((p) => groupOf(p.pos) === s.key)
      .sort((a, b) => b.pts - a.pts);
  });
  return { groups, total: roster.reduce((s, p) => s + p.pts, 0), count: roster.length };
}

function weekIsLocked(week) {
  const info = state.weekInfo.find((w) => w.week === week);
  if (!info || !info.lock_time) return false;
  return new Date(info.lock_time).getTime() <= Date.now();
}

function lockTimeText(week) {
  const info = state.weekInfo.find((w) => w.week === week);
  if (!info || !info.lock_time) return "not scheduled yet";
  return new Date(info.lock_time).toLocaleString(undefined, {
    weekday: "short", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit", timeZoneName: "short",
  });
}

// Sunday-eligible player pool for a week, sorted by projection.
function poolFor(week) {
  const ctx = {};
  state.weeklyPlayers.filter((w) => w.week === week && w.is_sunday)
    .forEach((w) => (ctx[w.player_id] = w));
  return state.players
    .filter((p) => ctx[p.id])
    .map((p) => ({ ...p, ...ctx[p.id] }))
    .sort((a, b) => {
      const ap = a.projected_points, bp = b.projected_points;
      if (ap == null && bp == null) return a.name.localeCompare(b.name);
      if (ap == null) return 1;
      if (bp == null) return -1;
      return bp - ap;
    });
}

function computeStandings(uptoWeek) {
  const totals = {};
  state.profiles.forEach((m) => (totals[m.id] = { w: 0, l: 0, t: 0, pts: 0 }));
  for (let wk = 1; wk <= uptoWeek; wk++) {
    const weekPoints = pointsMapFor(wk);
    if (Object.keys(weekPoints).length === 0) continue;
    const scores = state.profiles.map((m) => ({
      id: m.id,
      total: computeRoster(picksFor(wk, m.id), weekPoints).total,
    }));
    if (scores.length === 0) continue;
    const sorted = [...scores].sort((a, b) => b.total - a.total);
    const n = sorted.length, mid = n / 2;
    const median = n % 2 === 0
      ? (sorted[mid - 1].total + sorted[mid].total) / 2
      : sorted[Math.floor(mid)].total;
    scores.forEach((s) => {
      totals[s.id].pts += s.total;
      if (s.total > median) totals[s.id].w++;
      else if (s.total < median) totals[s.id].l++;
      else totals[s.id].t++;
    });
  }
  return totals;
}

function escapeHtml(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ====================================================================
// DATA LOADING
// ====================================================================
async function loadPublicInfo() {
  const [cntRes, metaRes] = await Promise.all([
    sb.from("profiles").select("id", { count: "exact", head: true }),
    sb.from("league_meta").select("*").eq("id", 1).maybeSingle(),
  ]);
  setState({
    teamCount: cntRes.count ?? state.teamCount,
    meta: metaRes.data || state.meta,
  });
}

async function loadAll() {
  const [playersRes, profilesRes, metaRes, picksRes, pointsRes, weekRes, wpRes] =
    await Promise.all([
      sb.from("players").select("*"),
      sb.from("profiles").select("*"),
      sb.from("league_meta").select("*").eq("id", 1).maybeSingle(),
      sb.from("picks").select("*"),
      sb.from("weekly_points").select("*"),
      sb.from("week_info").select("*"),
      sb.from("weekly_players").select("*"),
    ]);
  const meta = metaRes.data || state.meta;
  setState({
    players: playersRes.data || [],
    profiles: profilesRes.data || [],
    teamCount: (profilesRes.data && profilesRes.data.length) ?? state.teamCount,
    meta,
    picksRows: picksRes.data || [],
    pointsRows: pointsRes.data || [],
    weekInfo: weekRes.data || [],
    weeklyPlayers: wpRes.data || [],
    viewWeek: state.viewWeek || meta.current_week || 1,
    rosterManagerId: state.rosterManagerId || (state.session && state.session.user.id),
  });
}

async function refreshSession() {
  const { data } = await sb.auth.getSession();
  const session = data.session;
  let profile = null;
  if (session) {
    const { data: p } = await sb.from("profiles").select("*")
      .eq("id", session.user.id).maybeSingle();
    profile = p;
  }
  setState({ session, profile, loading: false, authError: "" });
  if (session) await loadAll();
}

// ====================================================================
// AUTH
// ====================================================================
async function doSignUp(email, password, teamName) {
  setState({ busy: true, authError: "" });
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) return setState({ busy: false, authError: error.message });
  if (!data.session) {
    return setState({ busy: false, authError:
      "Account created, but no session came back. Check that email confirmations are OFF in Supabase Auth settings, then sign in." });
  }
  const { error: pe } = await sb.from("profiles")
    .insert({ id: data.user.id, team_name: teamName || "New Team" });
  if (pe) {
    const full = /row-level security/i.test(pe.message);
    setState({ busy: false, authError: full
      ? "This league is full. Ask your commissioner to raise the team limit."
      : "Signed up, but the team profile failed: " + pe.message });
    await loadPublicInfo();
    return;
  }
  setState({ busy: false });
  await refreshSession();
}

async function doSignIn(email, password) {
  setState({ busy: true, authError: "" });
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return setState({ busy: false, authError: error.message });
  setState({ busy: false });
  await refreshSession();
}

async function doSignOut() {
  await sb.auth.signOut();
  setState({ session: null, profile: null, players: [], profiles: [],
    picksRows: [], pointsRows: [], weeklyPlayers: [], weekInfo: [] });
}

// ====================================================================
// WRITES
// ====================================================================
async function togglePick(playerId) {
  const week = state.viewWeek;
  const uid = state.session.user.id;

  if (weekIsLocked(week)) {
    return setState({ notice: "Week " + week + " is locked — rosters are final." });
  }

  const mine = picksFor(week, uid);
  const player = state.players.find((p) => p.id === playerId);
  if (!player) return;

  setState({ busy: true, notice: "" });

  if (mine.includes(playerId)) {
    const { error } = await sb.from("picks").delete()
      .eq("user_id", uid).eq("week", week).eq("player_id", playerId);
    if (error) {
      setState({ busy: false, notice: "Couldn't remove that pick: " + error.message });
      return;
    }
  } else {
    const g = groupOf(player.pos);
    const slot = SLOTS.find((s) => s.key === g);
    const counts = countByGroup(mine);
    if (!slot || counts[g] >= slot.cap) {
      return setState({ busy: false,
        notice: `You already have ${slot ? slot.cap : 0} ${slot ? slot.label : ""} — remove one first.` });
    }
    const { error } = await sb.from("picks").insert({ user_id: uid, week, player_id: playerId });
    if (error) {
      // The database enforces the same rules, so this is the backstop.
      setState({ busy: false, notice:
        /row-level security/i.test(error.message)
          ? "That pick was rejected — the week may have just locked, or that position is full."
          : "Couldn't add that pick: " + error.message });
      return;
    }
  }
  const { data } = await sb.from("picks").select("*");
  setState({ picksRows: data || [], busy: false });
}

async function commitMeta(field, value) {
  const v = field === "scoring_mode" ? value : parseInt(value);
  if (field !== "scoring_mode" && (isNaN(v) || v < 1)) return;
  await sb.from("league_meta").update({ [field]: v }).eq("id", 1);
  const { data } = await sb.from("league_meta").select("*").eq("id", 1).maybeSingle();
  setState({ meta: data || state.meta });
}

async function commitPoints(week, playerId, value) {
  const points = value === "" ? 0 : parseFloat(value);
  if (isNaN(points)) return;
  await sb.from("weekly_points").upsert({ player_id: playerId, week, points });
  const { data } = await sb.from("weekly_points").select("*");
  setState({ pointsRows: data || [] });
}

// ====================================================================
// RENDER
// ====================================================================
function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && "selectionStart" in active ? active.selectionStart : null;
  const app = document.getElementById("app");
  if (state.loading) {
    app.innerHTML = `<div class="p-8 text-center">Loading…</div>`;
    return;
  }
  app.innerHTML = state.session ? renderApp() : renderAuth();
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && "setSelectionRange" in el) {
        try { el.setSelectionRange(selStart, selStart); } catch (e) {}
      }
    }
  }
}

function renderAuth() {
  const err = state.authError
    ? `<div class="bg-brick text-chalk text-sm px-3 py-2 rounded mb-3">${escapeHtml(state.authError)}</div>` : "";
  const isSignup = state.authMode === "signup";
  const maxTeams = state.meta.max_teams || 10;
  const isFull = isSignup && state.teamCount >= maxTeams;
  return `
    <div class="bg-turf text-chalk px-4 py-6 text-center">
      <div class="text-2xl font-bold">Pick 'Em All</div>
      <div class="text-sm opacity-80">Everyone can pick anyone. Sunday games only.</div>
    </div>
    <div class="max-w-sm mx-auto p-4 mt-6">
      <div class="bg-chalk border border-line rounded-lg p-4">
        <div class="flex gap-2 mb-4">
          <button data-action="auth-mode" data-mode="signin"
            class="flex-1 px-3 py-2 rounded text-sm font-semibold ${!isSignup ? "bg-turf text-chalk" : "border border-line"}">Sign in</button>
          <button data-action="auth-mode" data-mode="signup"
            class="flex-1 px-3 py-2 rounded text-sm font-semibold ${isSignup ? "bg-turf text-chalk" : "border border-line"}">Create account</button>
        </div>
        ${err}
        ${isSignup ? `
          <div class="text-xs text-gray-500 mb-3">${state.teamCount}/${maxTeams} teams joined</div>
          ${isFull ? `<div class="bg-brick text-chalk text-sm px-3 py-2 rounded mb-3">This league is full. Ask your commissioner to raise the team limit.</div>` : ""}
          <label class="block text-xs font-semibold mb-1">Team name</label>
          <input id="signup-team" type="text" placeholder="e.g. Sunday Scaries"
            class="w-full border border-line rounded px-3 py-2 text-sm mb-3" />` : ""}
        <label class="block text-xs font-semibold mb-1">Email</label>
        <input id="auth-email" type="email" placeholder="you@example.com"
          class="w-full border border-line rounded px-3 py-2 text-sm mb-3" />
        <label class="block text-xs font-semibold mb-1">Password</label>
        <input id="auth-password" type="password" placeholder="At least 6 characters"
          class="w-full border border-line rounded px-3 py-2 text-sm mb-4" />
        <button data-action="${isSignup ? "signup" : "signin"}" ${state.busy || isFull ? "disabled" : ""}
          class="w-full bg-turf text-chalk font-semibold py-2 rounded hover:bg-turfdeep disabled:opacity-50">
          ${state.busy ? "Working…" : isSignup ? "Create account" : "Sign in"}
        </button>
      </div>
    </div>`;
}

function renderApp() {
  const myId = state.session.user.id;
  const me = state.profile;
  const tabs = [["picks", "My Picks"], ["rosters", "Rosters"], ["standings", "Standings"]];
  if (me && me.is_commissioner) tabs.push(["admin", "Commissioner"]);

  const locked = weekIsLocked(state.viewWeek);
  const header = `
    <div class="bg-turf text-chalk px-4 py-4">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div>
          <div class="text-xl font-bold">Pick 'Em All</div>
          <div class="text-sm opacity-80">Week ${state.meta.current_week} · ${escapeHtml(state.meta.scoring_mode || "standard")}</div>
        </div>
        <div class="flex items-center gap-3">
          <div class="text-right">
            <div class="text-xs opacity-70">Playing as</div>
            <div class="font-semibold">${escapeHtml((me && me.team_name) || "…")}</div>
          </div>
          <button data-action="signout" class="text-xs px-3 py-1 rounded border border-chalk">Sign out</button>
        </div>
      </div>
    </div>`;

  const tabBar = `
    <div class="flex gap-2 px-4 pt-4 flex-wrap">
      ${tabs.map(([k, l]) => `
        <button data-action="tab" data-tab="${k}"
          class="px-4 py-2 rounded-t-lg text-sm font-semibold border border-line ${state.tab === k ? "bg-turf text-chalk border-turf" : "bg-chalk"}">${l}</button>`).join("")}
    </div>`;

  const notice = state.notice
    ? `<div class="mx-4 mt-3 bg-gold text-turfdeep text-sm px-3 py-2 rounded">${escapeHtml(state.notice)}</div>` : "";

  let body = "";
  if (state.tab === "picks") body = renderPicksTab(myId, locked);
  else if (state.tab === "rosters") body = renderRostersTab(locked);
  else if (state.tab === "standings") body = renderStandingsTab();
  else if (state.tab === "admin") body = renderAdminTab();

  return header + tabBar + notice + `<div class="p-4">${body}</div>`;
}

function weekSelector() {
  const weeks = state.weekInfo.map((w) => w.week).sort((a, b) => a - b);
  const list = weeks.length ? weeks : [state.meta.current_week];
  return `<select data-bind="view-week" class="border border-line rounded px-2 py-1 text-sm">
    ${list.map((w) => `<option value="${w}" ${w === state.viewWeek ? "selected" : ""}>Week ${w}</option>`).join("")}
  </select>`;
}

function renderPicksTab(myId, locked) {
  const mine = picksFor(state.viewWeek, myId);
  const counts = countByGroup(mine);
  const pool = poolFor(state.viewWeek);
  const byId = Object.fromEntries(state.players.map((p) => [p.id, p]));
  const anyProjection = pool.some((p) => p.projected_points != null);

  const filtered = pool.filter((p) => {
    if (state.groupFilter !== "ALL" && groupOf(p.pos) !== state.groupFilter) return false;
    if (state.search && !p.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  });

  const complete = SLOTS.every((s) => counts[s.key] === s.cap);

  const slotSummary = SLOTS.map((s) => {
    const c = counts[s.key], done = c === s.cap;
    return `<span class="px-2 py-1 rounded-full border text-xs ${done ? "bg-turf text-chalk border-turf" : "bg-white border-line text-brick"}">
      <b>${s.label}</b> ${c}/${s.cap}</span>`;
  }).join("");

  const myRoster = mine.map((id) => byId[id]).filter(Boolean);

  return `
    <div class="bg-chalk border border-line rounded-lg p-4 mb-4">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
        <div class="flex items-center gap-2">${weekSelector()}
          <span class="font-semibold">${mine.length}/${ROSTER_SIZE} picked</span></div>
        <div class="text-xs ${locked ? "text-brick font-semibold" : "text-gray-600"}">
          ${locked ? "LOCKED since" : "Locks"} ${lockTimeText(state.viewWeek)}
        </div>
      </div>
      <div class="flex gap-2 flex-wrap mb-2">${slotSummary}</div>
      ${!locked && !complete ? `<div class="text-xs text-brick">Roster incomplete. Empty spots score zero — they aren't filled for you.</div>` : ""}
      ${locked ? `<div class="text-xs text-brick">Picks are final for this week.</div>` : ""}
      ${myRoster.length ? `<div class="mt-3 pt-3 border-t border-line">
        <div class="text-xs uppercase text-gray-500 mb-1">Your roster</div>
        <div class="flex flex-wrap gap-2">
          ${myRoster.map((p) => `<span class="text-xs bg-white border border-line rounded px-2 py-1">
            <b>${p.pos}</b> ${escapeHtml(p.name)}
            ${locked ? "" : `<button data-action="toggle-pick" data-id="${p.id}" class="ml-1 text-brick font-bold">&times;</button>`}
          </span>`).join("")}
        </div></div>` : ""}
    </div>

    <div class="bg-chalk border border-line rounded-lg p-4">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
        <div class="font-semibold text-sm">
          Sunday players ${anyProjection ? "— sorted by projected points" : ""}
        </div>
        <input id="search-input" type="text" value="${escapeHtml(state.search)}" data-bind="search"
          placeholder="Search players…" class="border border-line rounded px-3 py-1 text-sm" />
      </div>
      ${pool.length && !anyProjection ? `<div class="text-xs text-gray-500 mb-2">No projections available for this week — listed alphabetically.</div>` : ""}
      <div class="flex gap-2 mb-3 flex-wrap">
        ${["ALL", ...SLOTS.map((s) => s.key)].map((k) => {
          const label = k === "ALL" ? "ALL" : SLOTS.find((s) => s.key === k).label;
          return `<button data-action="group-filter" data-group="${k}"
            class="text-xs px-3 py-1 rounded-full border border-line ${state.groupFilter === k ? "bg-gold border-gold text-turfdeep" : "bg-white"}">${label}</button>`;
        }).join("")}
      </div>
      ${pool.length === 0 ? `<div class="text-sm text-gray-500 italic py-4">
        No Sunday player data for week ${state.viewWeek} yet. It appears once the sync job has run.
      </div>` : `
      <div class="max-h-[30rem] overflow-y-auto space-y-1">
        ${filtered.map((p) => {
          const picked = mine.includes(p.id);
          const g = groupOf(p.pos);
          const slot = SLOTS.find((s) => s.key === g);
          const groupFull = slot && counts[g] >= slot.cap;
          const disabled = locked || (!picked && groupFull);
          return `
            <div class="ff-row flex items-center justify-between px-3 py-2 rounded">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-xs font-bold px-2 py-1 rounded bg-turf text-chalk" style="min-width:34px;text-align:center">${p.pos}</span>
                <div class="min-w-0">
                  <div class="font-semibold truncate">${escapeHtml(p.name)}</div>
                  <div class="text-xs text-gray-500">${escapeHtml(p.team)} vs ${escapeHtml(p.opponent || "—")}</div>
                </div>
              </div>
              <div class="flex items-center gap-3 flex-shrink-0">
                <div class="text-right">
                  <div class="ff-num text-sm text-turf">${p.projected_points != null ? Number(p.projected_points).toFixed(1) : "—"}</div>
                  <div class="text-[10px] text-gray-400">proj</div>
                </div>
                <button data-action="toggle-pick" data-id="${p.id}" ${disabled ? "disabled" : ""}
                  class="text-xs px-3 py-1 rounded ${picked ? "bg-turf text-chalk" : "border border-turf text-turf"} ${disabled ? "opacity-40" : ""}">
                  ${picked ? "Remove" : "Add"}
                </button>
              </div>
            </div>`;
        }).join("")}
      </div>`}
    </div>`;
}

function renderRostersTab(locked) {
  const pts = pointsMapFor(state.viewWeek);
  const mgrId = state.rosterManagerId || (state.session && state.session.user.id);
  const roster = computeRoster(picksFor(state.viewWeek, mgrId), pts);
  const isMe = mgrId === state.session.user.id;

  return `
    <div class="flex items-center gap-3 mb-4 flex-wrap">
      ${weekSelector()}
      <select data-bind="roster-manager" class="border border-line rounded px-2 py-1 text-sm">
        ${state.profiles.map((m) => `<option value="${m.id}" ${m.id === mgrId ? "selected" : ""}>${escapeHtml(m.team_name)}</option>`).join("")}
      </select>
      <div class="ml-auto ff-num text-2xl text-turf">${roster.total.toFixed(1)} pts</div>
    </div>
    ${!locked && !isMe ? `<div class="bg-chalk border border-line rounded-lg p-4 text-sm text-gray-600">
      Other managers' rosters stay hidden until week ${state.viewWeek} locks, so nobody can copy a roster at the last minute.
      They open up at ${lockTimeText(state.viewWeek)}.
    </div>` : `
    <div class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr))">
      ${SLOTS.map((s) => `
        <div class="bg-chalk border border-line rounded-lg p-3">
          <div class="text-gray-500 text-xs uppercase mb-1">${s.label} (${roster.groups[s.key].length}/${s.cap})</div>
          ${roster.groups[s.key].length === 0
            ? `<div class="text-sm text-gray-400 italic">empty — scores 0</div>`
            : roster.groups[s.key].map((p) => `
              <div class="flex items-center justify-between py-1">
                <div class="text-sm min-w-0">
                  <span class="font-semibold">${escapeHtml(p.name)}</span>
                  <span class="text-gray-500 text-xs"> ${escapeHtml(p.team)}</span>
                </div>
                <div class="ff-num text-lg text-turf">${p.pts.toFixed(1)}</div>
              </div>`).join("")}
          ${roster.groups[s.key].length < s.cap && roster.groups[s.key].length > 0
            ? `<div class="text-xs text-brick mt-1">${s.cap - roster.groups[s.key].length} empty</div>` : ""}
        </div>`).join("")}
    </div>`}`;
}

function renderStandingsTab() {
  const standings = computeStandings(state.meta.current_week);
  const rows = state.profiles.map((m) => ({ ...m, ...standings[m.id] }))
    .sort((a, b) => b.w - a.w || b.pts - a.pts);
  return `
    <div class="bg-chalk border border-line rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead><tr class="bg-turf text-chalk">
          <th class="text-left px-3 py-2">Team</th>
          <th class="px-3 py-2">W</th><th class="px-3 py-2">L</th>
          <th class="px-3 py-2">T</th><th class="px-3 py-2">Total Pts</th>
        </tr></thead>
        <tbody>
          ${rows.map((r) => `<tr class="ff-row">
            <td class="px-3 py-2 font-semibold">${escapeHtml(r.team_name)}</td>
            <td class="text-center ff-num">${r.w}</td>
            <td class="text-center ff-num">${r.l}</td>
            <td class="text-center ff-num">${r.t}</td>
            <td class="text-center ff-num">${(r.pts || 0).toFixed(1)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      <div class="text-xs text-gray-500 p-3">
        Each week, teams above the league median get a win, below get a loss, exactly at it a tie.
        Weeks update automatically once final stats land — usually the night after the games.
      </div>
    </div>`;
}

function renderAdminTab() {
  const pool = poolFor(state.viewWeek);
  const pts = pointsMapFor(state.viewWeek);
  const filtered = pool.filter((p) =>
    !state.search || p.name.toLowerCase().includes(state.search.toLowerCase()));
  return `
    <div class="bg-chalk border border-line rounded-lg p-4 mb-4">
      <div class="flex items-center gap-3 mb-3 flex-wrap">
        <label class="text-sm font-semibold">Current week:</label>
        <input type="number" min="1" value="${state.meta.current_week}" data-bind="current-week"
          class="border border-line rounded px-2 py-1 w-20 text-sm" />
        <label class="text-sm font-semibold ml-2">Max teams:</label>
        <input type="number" min="1" value="${state.meta.max_teams || 10}" data-bind="max-teams"
          class="border border-line rounded px-2 py-1 w-20 text-sm" />
        <label class="text-sm font-semibold ml-2">Scoring:</label>
        <select data-bind="scoring-mode" class="border border-line rounded px-2 py-1 text-sm">
          ${["standard", "half", "ppr"].map((m) => `<option value="${m}" ${state.meta.scoring_mode === m ? "selected" : ""}>${m}</option>`).join("")}
        </select>
      </div>
      <div class="text-xs text-gray-600">
        Scoring changes apply the next time the sync job runs. Scores and standings fill in
        automatically — the manual entry below is only for corrections.
      </div>
    </div>

    <div class="bg-chalk border border-line rounded-lg p-4">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
        <div class="flex items-center gap-2 font-semibold text-sm">Manual points — ${weekSelector()}</div>
        <input id="search-input" type="text" value="${escapeHtml(state.search)}" data-bind="search"
          placeholder="Search players…" class="border border-line rounded px-3 py-1 text-sm" />
      </div>
      <div class="max-h-[28rem] overflow-y-auto space-y-1">
        ${filtered.map((p) => `
          <div class="ff-row flex items-center justify-between px-3 py-2 rounded">
            <div class="flex items-center gap-3 min-w-0">
              <span class="text-xs font-bold px-2 py-1 rounded bg-turf text-chalk" style="min-width:34px;text-align:center">${p.pos}</span>
              <div class="min-w-0">
                <div class="font-semibold truncate">${escapeHtml(p.name)}</div>
                <div class="text-xs text-gray-500">${escapeHtml(p.team)} vs ${escapeHtml(p.opponent || "—")}</div>
              </div>
            </div>
            <input type="number" step="0.1" data-bind="points" data-player-id="${p.id}"
              value="${pts[p.id] === undefined ? "" : pts[p.id]}" placeholder="0.0"
              class="border border-line rounded px-2 py-1 w-20 text-sm text-right" />
          </div>`).join("")}
      </div>
    </div>`;
}

// ====================================================================
// EVENTS
// ====================================================================
document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "auth-mode") setState({ authMode: el.dataset.mode, authError: "" });
  if (a === "signin") doSignIn(document.getElementById("auth-email").value,
    document.getElementById("auth-password").value);
  if (a === "signup") doSignUp(document.getElementById("auth-email").value,
    document.getElementById("auth-password").value,
    document.getElementById("signup-team").value);
  if (a === "signout") doSignOut();
  if (a === "tab") setState({ tab: el.dataset.tab, notice: "" });
  if (a === "group-filter") setState({ groupFilter: el.dataset.group });
  if (a === "toggle-pick") togglePick(el.dataset.id);
});

document.body.addEventListener("input", (e) => {
  if (e.target.dataset.bind === "search") setState({ search: e.target.value });
});

document.body.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.bind === "view-week") setState({ viewWeek: parseInt(el.value), notice: "" });
  if (el.dataset.bind === "roster-manager") setState({ rosterManagerId: el.value });
  if (el.dataset.bind === "current-week") commitMeta("current_week", el.value);
  if (el.dataset.bind === "max-teams") commitMeta("max_teams", el.value);
  if (el.dataset.bind === "scoring-mode") commitMeta("scoring_mode", el.value);
  if (el.dataset.bind === "points") commitPoints(state.viewWeek, el.dataset.playerId, el.value);
});

// ====================================================================
// INIT
// ====================================================================
loadPublicInfo();
refreshSession();
</script>
</body>
</html>

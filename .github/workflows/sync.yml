name: Sync NFL data

on:
  schedule:
    # Cron is UTC. ET times below assume EDT (UTC-4); after the November
    # clock change they land an hour earlier in local terms, which is
    # harmless here since nothing is tight against kickoff.
    #
    # Sunday's last game ends around 11:30 PM ET, and nflverse refreshes
    # its stats nightly — but not at a time they publish, so rather than
    # aiming at one exact window these runs take several passes at it.
    # Every write is an upsert, so repeats cost nothing.
    - cron: "0 9 * * *"     # 5:00 AM ET daily  - projections, schedule, week rollover
    - cron: "0 12 * * 1"    # 8:00 AM ET Monday - Sunday results
    - cron: "0 17 * * 1"    # 1:00 PM ET Monday - retry if the morning run was early
    - cron: "0 13 * * 2"    # 9:00 AM ET Tuesday - late stat corrections
  workflow_dispatch:         # manual run from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEASON: "2026"
        run: python sync.py
